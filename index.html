<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocha Cafe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #faf8f4;
            color: #292929;
            max-width: 500px;
            margin: auto;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .logo {
            font-size: 40px;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 30px;
        }

        .header p {
            color: #777;
            margin-top: 8px;
        }

        h2 {
            font-size: 21px;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 9px 0;
            font-size: 17px;
        }

        .item strong {
            font-weight: normal;
        }

        .contact {
            text-align: center;
            margin-top: 45px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #777;
            font-size: 14px;
        }

        .contact p {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="header">
